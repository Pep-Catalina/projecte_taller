version: '3.9'

services:
  nginx-digitalitzacio:
    build:
      context: ./docker/nginx
    image: nginx-digitalitzacio
    container_name: nginx-digitalitzacio
    hostname: srv-web
    ports:
      - "8080:80"
      - "4433:443"
    networks:
      digi-network:
        ipv4_address: 192.168.1.1
    dns:
      - 192.168.1.1

  api-digitalitzacio:
    build:
      context: ./docker/api
    image: api-digitalitzacio
    container_name: api-digitalitzacio
    hostname: srv-api
    ports:
      - "5000:5000"
    networks:
      digi-network:
        ipv4_address: 192.168.1.2
    dns:
      - 192.168.1.1

  mariadb-digitalitzacio:
    build:
      context: ./docker/mysql
    image: mariadb-digitalitzacio
    container_name: mariadb-digitalitzacio
    hostname: srv-db
    environment:
      MYSQL_ROOT_PASSWORD: Educem00
    ports:
      - "3366:3306"
    networks:
      digi-network:
        ipv4_address: 192.168.1.3
    dns:
      - 192.168.1.1
    dns_search:
      - centremedic.cat

networks:
  digi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254
